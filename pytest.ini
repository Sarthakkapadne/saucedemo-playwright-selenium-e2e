[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    smoke: Critical smoke tests for sanity verification
    regression: Comprehensive regression test suite
    playwright: Tests executed using Playwright engine
    selenium: Tests executed using Selenium WebDriver
    e2e: Complete end-to-end user journey tests
